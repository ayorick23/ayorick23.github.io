name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, audit & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (astro check)
        run: npx astro check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      # Only what ships to visitors; dev-only tools (OG generator, tests) don't reach the site.
      # High/critical advisories block unless listed, with a reason and review date, in audit-allowlist.json.
      - name: Security audit (production deps)
        run: npm run audit:ci

      - name: Unit & content tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify key pages were generated
        run: |
          for page in index.html 404.html es/index.html about/index.html es/about/index.html \
                      experience/index.html projects/index.html es/projects/index.html sitemap-index.xml; do
            test -f "dist/$page" || { echo "::error::Missing dist/$page"; exit 1; }
          done

      - name: Internal links
        run: npm run links

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Performance only warns: a shared CI runner is noisy. Accessibility, best practices and SEO block.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 7
