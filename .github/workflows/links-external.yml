name: External links

# External sites (GitHub, LinkedIn, certificate verifiers) can fail for reasons outside this repo, so they
# are checked weekly instead of blocking PRs. A failed run emails the repo owner.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check external links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # LinkedIn answers 999 to any bot and some verifiers rate-limit (429): those aren't broken links.
      # --base-url turns root-relative links (/projects, /#about) into site URLs, which the exclude below
      # skips: lychee can't resolve them in local files, and `npm run links` already checks them.
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --base-url https://dereckmendez.com
            --scheme https --scheme http
            --exclude-path dist/_astro
            --exclude "^https?://(www\.)?dereckmendez\.com"
            --exclude "^https?://(localhost|127\.0\.0\.1)"
            --accept 200..=299,403,429,999
            --max-retries 3
            --timeout 30
            "dist/**/*.html"
          fail: true
