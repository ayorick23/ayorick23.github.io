version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine updates instead of one per package; majors stay separate.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @astrojs/check pins its typescript peer range; a major bump breaks `npm ci` until Astro supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
